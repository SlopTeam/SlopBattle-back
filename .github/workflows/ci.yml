name: CI/CD back

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: back - lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  image:
    name: back - image Docker
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # develop -> image "staging" (déployée), main -> image "prod" (publiée, déploiement prod plus tard)
      PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') }}
      CHANNEL: ${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      # ghcr.io exige un nom d'image en minuscules
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Sur une PR ou une autre branche : build seul. Sur develop ou main : build + push.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ env.IMAGE }}:${{ env.CHANNEL }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: back - déploiement ${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}
    needs: image
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    # runner GitHub : plus de runner self-hosted, Portainer est joint via portainer.nalator.com (protégé par Cloudflare Access)
    runs-on: ubuntu-latest
    concurrency: back-${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}
    steps:
      - name: Redéployer la stack Portainer back (${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }})
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          STACK_ID: ${{ github.ref == 'refs/heads/main' && vars.PROD_STACK_ID || vars.STAGING_STACK_ID }}
        run: |
          # Relit la stack telle qu'elle est dans Portainer (compose + variables), puis la redéploie en re-téléchargeant l'image
          api() {
            curl -fsS --retry 3 \
              -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
              -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
              -H "X-API-Key: $PORTAINER_API_KEY" "$@"
          }
          STACK=$(api "$PORTAINER_URL/api/stacks/$STACK_ID")
          ENDPOINT=$(echo "$STACK" | jq -r .EndpointId)
          FILE=$(api "$PORTAINER_URL/api/stacks/$STACK_ID/file" | jq -r .StackFileContent)
          jq -n --arg f "$FILE" --argjson env "$(echo "$STACK" | jq '.Env // []')" \
            '{stackFileContent: $f, env: $env, prune: true, pullImage: true}' \
            | api -X PUT -H "Content-Type: application/json" -d @- \
              "$PORTAINER_URL/api/stacks/$STACK_ID?endpointId=$ENDPOINT" > /dev/null
          echo "Stack back $STACK_ID redéployée"
